<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{base}}/chat.css">
  <script id="sdialog-chat-config" type="application/json">{{config}}</script>
  <script src="{{base}}/chat.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <button class="btn btn-new" id="new-chat-side" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
        </button>
        <button class="icon-btn only-drawer" id="close-sidebar" type="button" aria-label="Close conversations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav class="conversation-list" id="conversation-list"></nav>
      <p class="sidebar-note">Conversations are saved in this browser only.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="header">
        <button class="icon-btn" id="open-sidebar" type="button" aria-label="Show conversations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="header-title">
          <span class="avatar" id="header-avatar" aria-hidden="true"></span>
          <div>
            <h1 id="title"></h1>
            <p class="subtitle" id="subtitle"></p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="new-chat" type="button" aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn" id="close-widget" type="button" aria-label="Close chat" title="Close" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message" maxlength="8000"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="composer-note">Enter to send, Shift+Enter for a new line</p>
      </form>
    </main>
  </div>
</body>
</html>
