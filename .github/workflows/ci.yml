name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 builds (3.9 is end-of-life)
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-audio-test.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 --ignore=W503 --max-line-length=120 --exclude=./tutorials/,./src/sdialog/audio/tts/dia2/_dia2/

      - name: Run tests with pytest and coverage
        run: |
          pip install pytest pytest-cov
          pytest -v --cov-report=xml --cov=src/sdialog

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
